name: Astra local path checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  paths:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Pure filesystem regressions; no game, login or network client
        run: node --experimental-strip-types --test tests/startup/upstream-path.test.ts tests/agency/status-export.test.ts tests/agency/semantic-progress.test.ts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.10'
      - name: Install pinned offline dependency
        run: npm install --prefix agents/advanced --ignore-scripts --no-audit --no-fund --no-package-lock --no-save zod@4.1.5
      - name: Exact interaction recovery on Windows and Linux
        run: bun test agents/advanced/tests/semantic-recovery.test.ts
      - name: Existing bootstrap and navigation startup regressions
        if: runner.os == 'Linux'
        run: bun test agents/advanced/tests/bootstrap.test.ts agents/advanced/tests/navigation-startup.test.ts
