name: Astra local path checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  paths:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Pure filesystem regressions; no game, login or network client
        run: node --experimental-strip-types --test tests/startup/upstream-path.test.ts
