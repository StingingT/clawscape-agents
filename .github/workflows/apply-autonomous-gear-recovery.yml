name: Apply autonomous gear and recovery patch
on:
  push:
    branches: [codex/autonomous-gear-and-recovery]
    paths: [.github/workflows/apply-autonomous-gear-recovery.yml]
permissions: { contents: write }
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22.16.0' }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: '1.3.10' }
      - name: Apply patch
        shell: python
        run: |
          from pathlib import Path

          p=Path('src/agency/director.ts'); s=p.read_text()
          anchor="""  /** Refresh the food dependency, not the strategic objective or a pending receipt. */"""
          addition="""  /** A currently selected non-transactional objective has no executable step in the fresh world state.
   * Retire only this bounded attempt; its goal predicate is not declared impossible and can be reconsidered after cooldown/new evidence. */
  deferCurrent(at:number,reason:string,evidence:string[]):void {
    if(this.memory.pending)throw new Error('RECONCILE_PENDING_ACTION_FIRST');
    if(!this.memory.active)return;
    this.review(at,'partial',reason,evidence);
  }

"""
          assert anchor in s and 'deferCurrent(at:number' not in s
          p.write_text(s.replace(anchor,addition+anchor,1))

          p=Path('src/agency/live-adapter.ts'); s=p.read_text()
          anchor="""  deferSurvey(route:Route,state:LiveState,reason:string):void {"""
          addition="""  deferCurrent(state:LiveState,reason:string):void {
    if(this.document.receipt||this.document.safetyReceipt)throw new Error('RECONCILE_PENDING_ACTION_FIRST');
    const goal=this.director.memory.active;
    if(!goal)return;
    this.director.deferCurrent(this.clock(),reason,[`fresh-no-executor:${state.tick}:${goal.id}`]);
    delete this.document.route;this.document.blocked=reason;this.save();
  }
"""
          assert anchor in s and 'deferCurrent(state:LiveState' not in s
          p.write_text(s.replace(anchor,addition+anchor,1))

          p=Path('src/agent.ts'); s=p.read_text()
          old="""    case 'equipment': return gearCandidates(state);"""
          new="""    case 'equipment': {
      // Equipment decisions are based on fresh carried/equipped state plus a bank view the agent actually observed.
      // Existing possessions beat purchases; no character-specific weapon is hardcoded here.
      const owned=await equipmentGoals.next(state,(from,to)=>navigator!.assess(from,to));
      return owned?[owned as Candidate]:gearCandidates(state);
    }"""
          assert old in s
          s=s.replace(old,new,1)
          old="""      } else if(!agency.summary().blocked && !agency.summary().acquisition?.need) agency.blocked('Selected task has no feasible current executor step: '+planned.task.id);"""
          new="""      } else if(!agency.summary().acquisition?.need) {
        agency.deferCurrent(state,'Selected task has no feasible current executor step: '+planned.task.id);
      }"""
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('agents/advanced/src/live-cli.ts'); s=p.read_text()
          old="""      if(decision.blocked){
        // A disappearing NPC or a short UI transition is a new observation"""
          new="""      if(decision.blocked){
        // A Director-selected exploration lead that its executor cannot use is a bounded failed attempt,
        // not a permanent character block. Preserve the lead as retryable evidence and let the Director replan.
        if(agency&&planned?.task.kind==='exploration'&&planned.task.route&&!agency.pending()&&!agency.pending('safety')){
          agency.deferSurvey(planned.task.route,agencyState(latest),decision.blocked);
          publish('REPLANNING',decision.blocked);await sleep(700);continue;
        }
        // A disappearing NPC or a short UI transition is a new observation"""
          assert old in s
          s=s.replace(old,new,1)
          old="""        if(step.blocked){if(agency&&!agency.pending())agency.blocked(step.blocked);policy.recordOutcome(latest,latest,decision,'FAILED');publish('REPLANNING',step.blocked);failed++;await sleep(700);continue;}"""
          new="""        if(step.blocked){
          if(agency&&!agency.pending()){
            if(planned?.task.kind==='exploration'&&planned.task.route)agency.deferSurvey(planned.task.route,agencyState(latest),step.blocked);
            else agency.deferCurrent(agencyState(latest),step.blocked);
          }
          policy.recordOutcome(latest,latest,decision,'FAILED');publish('REPLANNING',step.blocked);failed++;await sleep(700);continue;
        }"""
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('agents/advanced/src/live-policy.ts'); s=p.read_text()
          old="""      if (current < 0) return block(\"equipment\", shield ? \"MISSING_SHIELD\" : \"MISSING_SWORD\", \"No supported wielded or inventory sword/shield; an acquisition route is required before combat.\");"""
          new="""      if (current < 0) {
        // A fresh open-bank observation is authoritative ownership evidence. Withdraw a usable upgrade first;
        // otherwise ask the existing banking flow to inspect known storage before declaring acquisition necessary.
        const stored=(o.bank.open?o.bank.items??[]:[]).filter(i=>i.count>0&&rank(i,shield)>=0)
          .sort((a,b)=>rank(b,shield)-rank(a,shield)||a.slot-b.slot)[0];
        if(stored)return {goal:shield?'equipment:shield-bank':'equipment:sword-bank',reason:'Withdraw the strongest usable owned upgrade from the freshly observed bank; no item or slot is assumed.',
          intent:{operation:'withdraw',slot:stored.slot,item_id:stored.id,amount:1}};
        if(!o.bank.open&&this.state.bankLead)return this.startBank(o);
        return block(\"equipment\", shield ? \"MISSING_SHIELD\" : \"MISSING_SWORD\", \"No supported wielded, carried, or freshly observed banked sword/shield; an acquisition route is required before combat.\");
      }"""
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Install pinned dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/agency-tests" --ignore-scripts --no-audit --no-fund --no-package-lock zod@4.1.5 typescript@5.9.3 @types/node@22.16.0
          ln -s "$RUNNER_TEMP/agency-tests/node_modules" agents/advanced/node_modules
      - name: Validate
        run: |
          git diff --check
          npm run test:agency
          npm run test:integration
          npm run check:agency
          bun test agents/advanced/tests/agency-policy.test.ts agents/advanced/tests/combat-observer.test.ts
      - name: Commit tested source
        run: |
          git add src/agency/director.ts src/agency/live-adapter.ts src/agent.ts agents/advanced/src/live-cli.ts agents/advanced/src/live-policy.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Replan blocked work and use observed owned gear'
          git push origin HEAD:codex/autonomous-gear-and-recovery
