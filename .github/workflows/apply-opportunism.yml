name: Apply opportunistic resource integration
on:
  push:
    branches: [codex/opportunistic-resources]
    paths: [.github/workflows/apply-opportunism.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: '1.3.10' }
      - name: Integrate generic side opportunities without replacing primary goals
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/agent.ts'); s=p.read_text()
          old="import { isAgentClutter, isUrgentClutter, isBankableResource, isFinishedArrow, surplusArrowAmount } from './inventory-policy';"
          new=old+"\nimport { incidentalOpportunity, bankableIncidentalEquipment } from './opportunity-policy';"
          assert old in s and "./opportunity-policy" not in s
          s=s.replace(old,new,1)
          old="if (isAgentClutter(item, build, equippedNames, keepWeaponName)) return true;"
          new=old+"\n    if (bankableIncidentalEquipment(item) && String(item.name) !== String(keepWeaponName ?? '')) return true;"
          assert old in s
          s=s.replace(old,new,1)
          needle="""  if ((state.inventory?.length ?? 0) === 0) {
              const guide=(state.nearbyNpcs??[]).find(n=>/runescape guide|tutorial guide/i.test(String(n.name))&&n.reachable===true);
              if(guide)return [{id:'tutorial-guide',type:'talkToNpc',fields:{npcIndex:guide.index},waitTicks:3}];
            }
          """
          add=needle+"""  // Evaluate one cheap side opportunity only after the Director has selected the primary task.
            // The side action does not replace that goal and cannot justify a long detour.
            const incidental=incidentalOpportunity(state,task.kind) as Candidate|undefined;
            if(incidental)return [incidental];
          """
          assert needle in s
          s=s.replace(needle,add,1)
          p.write_text(s)
      - name: Install pinned offline agency dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/agency-tests" --ignore-scripts --no-audit --no-fund --no-package-lock zod@4.1.5 typescript@5.9.3 @types/node@22.16.0
          ln -s "$RUNNER_TEMP/agency-tests/node_modules" agents/advanced/node_modules
      - run: bun test src/opportunity-policy.test.ts
      - run: npm run test:agency
      - run: npm run test:integration
      - run: npm run check:agency
      - name: Commit tested product files
        run: |
          git diff --check
          git add src/agent.ts src/opportunity-policy.ts src/opportunity-policy.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use worthwhile incidental resources without abandoning primary goals'
          git push origin HEAD:codex/opportunistic-resources
