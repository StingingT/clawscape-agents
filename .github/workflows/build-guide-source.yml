name: Build guide source snapshot
on:
  push:
    branches: [codex/strategic-hierarchy-builds]
    paths: [.github/workflows/build-guide-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: git archive --format=zip --output=build-guide-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-guide-source
          path: build-guide-source.zip
          retention-days: 1
