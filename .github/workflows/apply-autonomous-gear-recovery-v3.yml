name: Apply autonomous gear recovery v3
on:
  push:
    branches:
      - codex/autonomous-gear-and-recovery
    paths:
      - tools/apply-autonomous-gear-recovery.py
      - .github/workflows/apply-autonomous-gear-recovery-v3.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.10'
      - name: Apply
        run: python tools/apply-autonomous-gear-recovery.py
      - name: Install
        run: |
          npm install --prefix "$RUNNER_TEMP/agency-tests" --ignore-scripts --no-audit --no-fund --no-package-lock zod@4.1.5 typescript@5.9.3 @types/node@22.16.0
          ln -s "$RUNNER_TEMP/agency-tests/node_modules" agents/advanced/node_modules
      - name: Test
        run: |
          git diff --check
          npm run test:agency
          npm run test:integration
          npm run check:agency
          bun test agents/advanced/tests/agency-policy.test.ts agents/advanced/tests/combat-observer.test.ts
      - name: Commit
        run: |
          git add src/agency/director.ts src/agency/live-adapter.ts src/agent.ts agents/advanced/src/live-cli.ts agents/advanced/src/live-policy.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Replan blocked work and use observed owned gear'
          git push origin HEAD:codex/autonomous-gear-and-recovery
