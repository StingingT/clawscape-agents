name: Integrate immediate incidental use
on:
  push:
    branches: [codex/incidental-immediate-use]
    paths: [.github/workflows/apply-incidental-use.yml]
permissions: { contents: write }
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: '1.3.10' }
      - name: Wire immediate incidental use below the primary goal
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/agent.ts');s=p.read_text()
          old="import { acquisitionActions, type AcquisitionHint } from './agency/acquisition.ts';"
          new=old+"\nimport { chooseIncidentalUse } from './agency/incidental-use.ts';"
          assert old in s and 'chooseIncidentalUse' not in s
          s=s.replace(old,new,1)
          needle="""  if ((state.inventory?.length ?? 0) === 0) {
              const guide=(state.nearbyNpcs??[]).find(n=>/runescape guide|tutorial guide/i.test(String(n.name))&&n.reachable===true);
              if(guide)return [{id:'tutorial-guide',type:'talkToNpc',fields:{npcIndex:guide.index},waitTicks:3}];
            }
          """
          add=needle+"""  // A cheap observed side-use may happen inside the selected goal. Normal begin() still
            // applies development/protected-XP guards before dispatch, so this cannot bypass a build boundary.
            const incidentalUse=chooseIncidentalUse(state) as Candidate|undefined;
            if(incidentalUse)return [incidentalUse];
          """
          assert needle in s;s=s.replace(needle,add,1);p.write_text(s)
          q=Path('scripts/test-agency-controller.cjs');t=q.read_text()
          t=t.replace("urgentAgencyAction:()=>undefined,validateMetal", "chooseIncidentalUse:()=>undefined,urgentAgencyAction:()=>undefined,validateMetal")
          t=t.replace("const env={agency,steps:11,character:'test',role:'resource',build:'melee',forumEnabled:false,", "const env={agency,steps:11,character:'test',role:'resource',build:'melee',forumEnabled:false,chooseIncidentalUse:()=>undefined,")
          q.write_text(t)
      - run: npm install --prefix "$RUNNER_TEMP/agency-tests" --ignore-scripts --no-audit --no-fund --no-package-lock zod@4.1.5 typescript@5.9.3 @types/node@22.16.0
      - run: ln -s "$RUNNER_TEMP/agency-tests/node_modules" agents/advanced/node_modules
      - run: node --experimental-strip-types --test src/agency/incidental-use.test.ts
      - run: npm run test:agency
      - run: npm run test:integration
      - run: npm run check:agency
      - name: Commit tested integration
        run: |
          git diff --check
          git add src/agent.ts scripts/test-agency-controller.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use low-cost incidental resources for immediate progression'
          git push origin HEAD:codex/incidental-immediate-use
