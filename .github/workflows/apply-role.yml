name: Apply role and dialogue recovery
on:
  push:
    branches: [codex/role-ambitions-dialogue-audit]
    paths: [.github/workflows/apply-role.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.10'
      - name: Apply exact reviewed patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/role.patch
          git apply --check /tmp/role.patch
          git apply /tmp/role.patch
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Agency tests
        run: npm run test:agency
      - name: Integration tests
        run: npm run test:integration
      - name: Type checks
        run: npm run check:agency
      - name: Focused Bun tests
        run: bun test tests/agency/build-guides.test.ts agents/advanced/tests/restart-journals.test.ts
      - name: Commit tested source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/agency/development.ts scripts/supervise.ts agents/advanced/src/transient-recovery.ts agents/advanced/src/restart-journals.ts tests/agency/build-guides.test.ts agents/advanced/tests/restart-journals.test.ts
          git commit -m 'Keep broad role ambitions and safely retire stale dialogue contexts'
          git push origin HEAD:codex/role-ambitions-dialogue-audit
