name: Historical context recovery validation
on:
  push:
    branches: [fix/historical-context-and-exhausted-routes]
permissions:
  contents: write
concurrency:
  group: historical-context-workbench
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.10'
      - name: Apply guarded integration changes
        run: |
          python3 .github/apply-historical-context.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/agency/live-adapter.ts')
          s=p.read_text().replace("this controller's measured", 'the current controller-owned measured')
          old='metrics={spentGp:0,lostGp:0,deaths:0,elapsedMs:Math.max(0,this.clock()-receipt.startedAt)};'
          assert s.count(old)==1
          s=s.replace(old,'metrics={spentGp:0,lostGp:0,deaths:0,elapsedMs:0};')
          p.write_text(s)
          PY
          git diff --check
      - name: Install pinned offline test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/agency-tests" --ignore-scripts --no-audit --no-fund --no-package-lock zod@4.1.5 typescript@5.9.3 @types/node@22.16.0
          ln -s "$RUNNER_TEMP/agency-tests/node_modules" agents/advanced/node_modules
      - name: Exact historical context and exhausted exploration regressions
        run: bun test tests/agency/historical-context.test.ts agents/advanced/tests/historical-context.test.ts
      - name: Shared agency regression suite
        run: npm run test:agency
      - name: Original controller integration
        run: npm run test:integration
      - name: Agency type checks
        run: npm run check:agency
      - name: Repository-local Bun suite without external server content
        shell: bash
        run: |
          # These four unchanged suites require the separate upstream game checkout
          # (obj.pack and source maps), which is not part of this repository/runner.
          # Run every other suite, including all new tests. No assertions are changed.
          printf '%s\n' 'External-game-data suites not validated here: src/economy/market.test.ts src/economy/metalworking.test.ts src/goals/planner.test.ts src/goals/outcomes.test.ts'
          mkdir -p data
          mapfile -t suites < <(find src tests agents/advanced/tests -type f -name '*.test.ts' \
            ! -path 'src/economy/market.test.ts' ! -path 'src/economy/metalworking.test.ts' \
            ! -path 'src/goals/planner.test.ts' ! -path 'src/goals/outcomes.test.ts' | sort)
          test "${#suites[@]}" -gt 60
          bun test "${suites[@]}"
      - name: Commit only validated integration and remove temporary workbench
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/apply-historical-context.py .github/workflows/historical-context-workbench.yml
          git add src/agency/live-adapter.ts src/agency/director.ts src/agency/world-model.ts agents/advanced/src/transient-recovery.ts agents/advanced/src/agency-bridge.ts agents/advanced/src/restart-journals.ts agents/advanced/src/live-cli.ts
          git diff --cached --check
          git commit -m 'Recover ended historical contexts without replay and defer exhausted routes'
          git push origin HEAD:fix/historical-context-and-exhausted-routes
