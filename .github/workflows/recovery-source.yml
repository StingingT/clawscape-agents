name: Recovery source snapshot
on:
  push:
    branches: [codex/movement-startup-recovery]
permissions:
  contents: read
jobs:
  source:
    if: contains(github.event.head_commit.message, 'Capture exact source')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: git archive --format=zip HEAD -o /tmp/source.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-source
          path: /tmp/source.zip
          retention-days: 1
