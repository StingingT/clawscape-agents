name: Hierarchy source snapshot
on:
  push:
    branches: [codex/strategic-hierarchy-builds]
permissions:
  contents: read
jobs:
  snapshot:
    if: contains(github.event.head_commit.message, 'Snapshot source')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: git archive --format=zip --output=hierarchy-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hierarchy-source
          path: hierarchy-source.zip
          retention-days: 1
