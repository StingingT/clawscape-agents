name: Route repair source snapshot
on:
  push:
    branches: [codex/route-progress-startup-v2]
    paths: [.github/workflows/route-repair-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: git archive --format=zip HEAD -o /tmp/route-repair-source.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: route-repair-source
          path: /tmp/route-repair-source.zip
          retention-days: 1
