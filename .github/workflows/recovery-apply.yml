name: Apply verified movement and startup recovery
on:
  push:
    branches: [codex/movement-startup-recovery]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'StingingT/clawscape-agents' && contains(github.event.head_commit.message, '[apply-recovery]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.10'
      - name: Verify exact before and after source hashes
        run: python3 .ci/apply-recovery.py
      - name: Install pinned offline test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/agency-tests" --ignore-scripts --no-audit --no-fund --no-package-lock zod@4.1.5 typescript@5.9.3 @types/node@22.16.0
          ln -s "$RUNNER_TEMP/agency-tests/node_modules" agents/advanced/node_modules
      - run: npm run test:agency
      - run: npm run test:integration
      - run: npm run check:agency
      - name: Native controller and recovery regressions
        run: bun test src/action-outcome.test.ts src/training/discovery.test.ts src/progression-policy.test.ts src/economy/resource-agent.test.ts agents/advanced/tests
      - name: Bundle controller entry points without running them
        run: bun build src/agent.ts agents/advanced/src/live-cli.ts scripts/astra.ts --target=bun --outdir "$RUNNER_TEMP/agency-build"
      - name: Publish tested source on this branch only
        run: |
          python3 .ci/apply-recovery.py stage
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply tested movement-leg reconciliation, startup paths and goal cleanup'
          git push origin HEAD:refs/heads/codex/movement-startup-recovery
