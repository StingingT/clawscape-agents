name: Apply tested trip recovery
on:
  push:
    branches: [codex/adaptive-trip-recovery]
    paths: [.github/workflows/apply-trip.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.10'
      - name: Verify transport and every original and resulting source hash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os
          from pathlib import Path
          hashes = ['589bdf9f4a1fca5603314be3b3ddf3659255d81cc45789e3446f7e8f648d920a', '7ca8861998169e337c8ebdce981e2118f7034c220a5172d0c7be3609daddd0d4', '2a01df1927a3eb22c7dd4a8dc091fcdc11f906e57b2079d44924b2a53402d8fe']
          chunks = []
          for index, expected in enumerate(hashes, 1):
              text = Path(f'.delivery/trip-part{index}.txt').read_text().strip()
              assert hashlib.sha256(text.encode()).hexdigest() == expected, f'transport hash mismatch: part {index}'
              chunks.append(text)
          compressed = base64.b64decode(''.join(chunks), validate=True)
          assert hashlib.sha256(compressed).hexdigest() == 'c11deadd92af340f7a51f813e197d1bee4505ca2f66f91ecf8cd8468c9c87926'
          raw = lzma.decompress(compressed)
          assert len(raw) == 76467 and hashlib.sha256(raw).hexdigest() == '45f4102d35b9f11bff46308558a1dff87409d2ad61ddbeed3eafdf5ef03bde05'
          manifest = json.loads(raw)
          assert len(manifest) == 32
          paths = []
          for entry in manifest:
              path = Path(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts and not path.is_symlink()
              assert str(path).startswith(('src/', 'tests/', 'scripts/', 'agents/advanced/src/', 'agents/advanced/tests/', 'docs/'))
              assert path.suffix in ('.ts', '.cjs', '.md') and str(path) not in paths
              old = path.read_bytes() if path.exists() else b''
              assert hashlib.sha256(old).hexdigest() == entry['before'], f'original source mismatch: {path}'
              lines = old.decode('utf-8').splitlines(keepends=True)
              last = len(lines) + 1
              for start, end, text in reversed(entry['edits']):
                  assert 0 <= start <= end <= len(lines) and end <= last
                  lines[start:end] = text.splitlines(keepends=True)
                  last = start
              new = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(new).hexdigest() == entry['after'], f'result mismatch: {path}'
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(new)
              paths.append(str(path))
          Path(os.environ['RUNNER_TEMP'], 'trip-paths.json').write_text(json.dumps(paths))
          print('All 32 source files match the offline-tested hashes.')
          PY
          git diff --check
      - name: Install pinned offline test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/trip-tests" --ignore-scripts --no-audit --no-fund --no-package-lock zod@4.1.5 typescript@5.9.3 @types/node@22.16.0
          ln -s "$RUNNER_TEMP/trip-tests/node_modules" node_modules
          ln -s "$RUNNER_TEMP/trip-tests/node_modules" agents/advanced/node_modules
      - run: npm run test:agency
      - run: npm run test:integration
      - run: npm run check:agency
      - name: Native outcome, training and Astra regressions
        run: bun test src/action-outcome.test.ts src/training/discovery.test.ts agents/advanced/tests src/navigation/agency-route.test.ts
      - name: Operator environment does not contaminate startup regression
        env:
          CLAWSCAPE_UPSTREAM: /operator/custom-server-path
        run: bun test tests/startup/upstream-path.test.ts
      - name: Commit tested source only
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          paths = json.loads(Path(os.environ['RUNNER_TEMP'], 'trip-paths.json').read_text())
          subprocess.run(['git', 'add', '--', *paths], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Learn trip provisions and cargo targets; reconcile supported actions and Astra movement conservatively'
          git push origin HEAD:codex/adaptive-trip-recovery
          git rev-parse HEAD
