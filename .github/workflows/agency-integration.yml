name: Apply tested agency integration
on:
  push:
    branches: [codex/authoritative-goal-integration]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'StingingT/clawscape-agents' && contains(github.event.head_commit.message, '[apply-agency]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.10'
      - name: Apply exact reviewed source versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.ci/apply.py')
          s = p.read_text()
          old = "'.github/workflows/agency-tests.yml': 'dfd386029994f5dbbfe4175b7e1e4c8cbc7185ef'"
          new = "'.github/workflows/agency-tests.yml': '27b9a5b0ab8e9a21cc4526e59e43a02b4852f1c6'"
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
          python3 .ci/apply.py
      - name: Install pinned offline test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/agency-tests" --ignore-scripts --no-audit --no-fund --no-package-lock zod@4.1.5 typescript@5.9.3 @types/node@22.16.0
          ln -s "$RUNNER_TEMP/agency-tests/node_modules" agents/advanced/node_modules
      - run: npm run test:agency
      - run: npm run test:integration
      - run: npm run check:agency
      - name: Native outcome, training and Astra tests
        run: bun test src/action-outcome.test.ts src/training/discovery.test.ts agents/advanced/tests/agency-policy.test.ts
      - name: Commit validated readable source on this branch only
        run: |
          test "$GITHUB_REF" = 'refs/heads/codex/authoritative-goal-integration'
          rm .ci/apply.py .ci/shared-edits.py .ci/other-edits.py .github/workflows/agency-integration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/agent.ts src/agency/director.ts src/agency/types.ts src/action-outcome.test.ts src/training/discovery.ts src/training/discovery.test.ts agents/advanced/src/live-cli.ts agents/advanced/src/live-policy.ts docs/AGENCY_REQUIREMENTS.md package.json scripts/supervise.ts .ci/apply.py .ci/shared-edits.py .ci/other-edits.py .github/workflows/agency-integration.yml
          git diff --cached --check
          git commit -m 'Apply and validate authoritative goal-first controller integration'
          git push origin HEAD:refs/heads/codex/authoritative-goal-integration
