name: Apply replanning fix
on:
  push:
    branches: [fix/replanning-incidental-reconciliation]
    paths:
      - tools/apply-replanning-fix.py
      - .github/workflows/apply-replanning-fix.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.10'
      - name: Apply targeted source patch
        run: python tools/apply-replanning-fix.py
      - name: Install pinned test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/agency-tests" --ignore-scripts --no-audit --no-fund --no-package-lock zod@4.1.5 typescript@5.9.3 @types/node@22.16.0
          ln -s "$RUNNER_TEMP/agency-tests/node_modules" agents/advanced/node_modules
      - name: Validate
        run: |
          git diff --check
          npm run test:agency
          npm run test:integration
          npm run check:agency
          bun test agents/advanced/tests/replanning.test.ts agents/advanced/tests/agency-policy.test.ts
      - name: Commit tested patch
        run: |
          git add agents/advanced/src/live-cli.ts agents/advanced/src/replanning.ts agents/advanced/tests/replanning.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Replan recoverable executor dead ends'
          git push origin HEAD:fix/replanning-incidental-reconciliation
