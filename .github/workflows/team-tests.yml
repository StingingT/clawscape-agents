name: Local team and approval controls
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  controls:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.10'
      - name: Pinned validation dependencies only; no model or game login
        run: npm install --prefix agents/advanced --ignore-scripts --no-audit --no-fund --no-package-lock --no-save zod@4.1.5 typescript@5.9.3 @types/node@22.16.0
      - run: npm run test:team
      - run: bun test tests/team
      - run: npm run check:team
      - run: npm run test:integration
