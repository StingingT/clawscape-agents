name: Discovery implementation validation
on:
  push:
    branches: [fix/discovery-transaction-isolation]
    paths: [.github/workflows/discovery-workbench.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.10'
      - name: Check reviewed source base and patch integrity
        run: |
          git diff --exit-code 9c34fd1e23f089b1900c96bf34a08192fd94e0f9 -- src scripts tests docs agents/advanced/src agents/advanced/tests
          python - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          encoded=''.join(Path(f'.github/discovery-payload-{i}.b64').read_text().strip() for i in range(1,5))
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'b319d1ed877039663d1ad9d42d6fc7a0dfff1a99fd0a189aa6952c6abdcda116', 'Patch integrity check failed'
          Path('/tmp/discovery.patch').write_bytes(patch)
          PY
          git apply --check --unidiff-zero /tmp/discovery.patch
          git apply --unidiff-zero /tmp/discovery.patch
      - name: Pinned test dependencies outside source tree
        run: |
          npm install --prefix "$RUNNER_TEMP/discovery-tests" --ignore-scripts --no-audit --no-fund --no-package-lock zod@4.1.5 typescript@5.9.3 @types/node@22.16.0
          ln -s "$RUNNER_TEMP/discovery-tests/node_modules" agents/advanced/node_modules
      - name: Validate shared planner, controller scenarios and advanced effects
        run: |
          npm run test:agency
          npm run test:integration
          npm run check:agency
          bun test src/action-outcome.test.ts src/training/discovery.test.ts agents/advanced/tests src/navigation/agency-route.test.ts
      - name: Commit only reviewed implementation and regression files
        run: |
          git add agents/advanced/src/arbiter.ts agents/advanced/src/live-policy.ts agents/advanced/tests/agency-policy.test.ts docs/DISCOVERY_AND_TRANSACTION_ISOLATION.md scripts/agency-status.ts scripts/status-export.ts scripts/test-agency-controller.cjs src/action-outcome.ts src/agency/director.ts src/agency/discovery.ts src/agency/live-adapter.ts src/agency/transaction-isolation.ts src/agency/world-model.ts src/agent.ts tests/agency/discovery-isolation.test.ts tests/agency/incidental-purpose.test.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add observed local discovery, transition evidence and non-economic isolation for unresolved transfers'
          git push origin HEAD:fix/discovery-transaction-isolation
