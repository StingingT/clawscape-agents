name: Discovery quarantine patch validation
on:
  push:
    branches: [fix/discovery-and-transaction-quarantine]
    paths:
      - .github/finalize-discovery-review.py
      - .github/workflows/discovery-quarantine-workbench.yml
      - tests/agency/transaction-quarantine-boundaries.test.ts
      - agents/advanced/tests/transaction-quarantine.test.ts
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.10'
      - name: Apply final audit edits
        run: |
          python .github/finalize-discovery-review.py
          git diff --check
      - name: Install pinned offline test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/claw-deps" --ignore-scripts --no-audit --no-fund --no-package-lock zod@4.1.5 typescript@5.9.3 @types/node@22.16.0
          ln -s "$RUNNER_TEMP/claw-deps/node_modules" agents/advanced/node_modules
      - name: Exact transaction and discovery regressions
        run: |
          node --experimental-strip-types --test tests/agency/discovery-bootstrap-gate.test.ts tests/agency/transaction-quarantine-boundaries.test.ts
          bun test agents/advanced/tests/transaction-quarantine.test.ts
      - name: Validate shared agency and original controller integration
        run: |
          npm run test:agency
          npm run test:integration
          npm run check:agency
      - name: Validate advanced recovery and policy
        run: bun test agents/advanced/tests/semantic-recovery.test.ts agents/advanced/tests/restart-journals.test.ts agents/advanced/tests/agency-policy.test.ts
      - name: Commit validated audit implementation
        run: |
          git add src/agency/live-adapter.ts agents/advanced/src/agency-bridge.ts agents/advanced/src/live-cli.ts agents/advanced/src/live-policy.ts agents/advanced/src/restart-journals.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve exact unresolved transaction evidence across shared and executor journals'
          git push origin HEAD:fix/discovery-and-transaction-quarantine
