name: Add conservative legacy item recovery
on:
  push:
    branches: [codex/agent-recovery-combat-fixes]
    paths: [.github/workflows/apply-stinger-recovery.yml]
permissions: { contents: write }
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22.16.0' }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: '1.3.10' }
      - name: Extend conservative legacy recipe retirement
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/agency/item-intents.ts');s=p.read_text()
          old="""    return !!tool&&((tool.id===946&&itemName(tool.name)==='knife')||(tool.id===590&&itemName(tool.name)==='tinderbox'))
      && !a.some(i=>i.slot===target)&&!b.some(i=>i.slot===target)
      && !(before.unavailable??[]).includes('inventory')&&!(after.unavailable??[]).includes('inventory');"""
          new="""    const knownTool=!!tool&&((tool.id===946&&itemName(tool.name)==='knife')||(tool.id===590&&itemName(tool.name)==='tinderbox'));
    const targetMissingBefore=!a.some(i=>i.slot===target),targetMissingAfter=!b.some(i=>i.slot===target);
    const complete=!(before.unavailable??[]).includes('inventory')&&!(after.unavailable??[]).includes('inventory');
    // Legacy pre-itemRefs receipts may have pointed at a slot that was already empty. Once a
    // known repeatable tool is still observed and that same target slot is absent in both the
    // captured pre-state and a fresh idle state, the stale packet cannot be made safe by replay.
    // Retire it as interrupted only; do not claim the old recipe succeeded or never executed.
    return knownTool&&targetMissingBefore&&targetMissingAfter&&complete;"""
          assert old in s
          p.write_text(s.replace(old,new,1))
      - name: Add regression test
        run: |
          cat >> src/agency/item-intents.test.ts <<'EOF'
          
          test('legacy known-tool action with an already-empty target slot is retireable but not successful',()=>{
            const before:any={inventory:[{id:946,name:'Knife',slot:5,count:1}],unavailable:[]};
            const after:any={inventory:[{id:946,name:'Knife',slot:5,count:1}],unavailable:[]};
            expect(obsoleteEmptyRecipe({type:'useItemOnItem',fields:{sourceSlot:5,targetSlot:3}},before,after)).toBe(true);
          });
          EOF
      - name: Install dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/agency-tests" --ignore-scripts --no-audit --no-fund --no-package-lock zod@4.1.5 typescript@5.9.3 @types/node@22.16.0
          ln -s "$RUNNER_TEMP/agency-tests/node_modules" agents/advanced/node_modules
      - run: bun test src/agency/item-intents.test.ts src/agency/step-retry.test.ts
      - run: npm run test:agency
      - run: npm run check:agency
      - name: Commit tested source
        run: |
          git diff --check
          git add src/agency/item-intents.ts src/agency/item-intents.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Retire stale legacy tool receipts conservatively'
          git push origin HEAD:codex/agent-recovery-combat-fixes
