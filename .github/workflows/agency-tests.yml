name: Agency regression checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.10'
      - name: Install pinned test dependencies
        working-directory: agents/advanced
        run: bun install --frozen-lockfile
      - run: npm run test:agency
      - run: npm run test:integration
      - run: npm run check:agency
      - name: Native outcome, training and Astra policy regressions
        run: bun test src/action-outcome.test.ts src/training/discovery.test.ts agents/advanced/tests/agency-policy.test.ts
