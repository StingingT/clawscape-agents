name: Semantic progress workbench
on:
  push:
    branches: [fix/semantic-progress-recovery]
    paths: [.github/workflows/semantic-progress-workbench.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.10'
      - name: Prepare offline source and test tools without Git credentials
        run: |
          mkdir -p "$RUNNER_TEMP/workbench/repo" "$RUNNER_TEMP/workbench/bin"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/workbench/repo"
          git rev-parse HEAD > "$RUNNER_TEMP/workbench/commit.txt"
          cp "$(command -v bun)" "$RUNNER_TEMP/workbench/bin/bun"
          npm install --prefix "$RUNNER_TEMP/workbench/repo/agents/advanced" --ignore-scripts --no-audit --no-fund --no-package-lock zod@4.1.5 typescript@5.9.3 @types/node@22.16.0
          tar -czf "$RUNNER_TEMP/workbench.tar.gz" -C "$RUNNER_TEMP/workbench" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semantic-progress-workbench
          path: ${{ runner.temp }}/workbench.tar.gz
          retention-days: 1
