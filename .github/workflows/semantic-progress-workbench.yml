name: Semantic progress patch validation
on:
  push:
    branches: [fix/semantic-progress-recovery]
    paths: [.github/workflows/semantic-progress-workbench.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.10'
      - name: Verify exact source base and apply integrity-checked patch
        run: |
          git diff --exit-code 54c90386c3d2e9d4d4143a214981ffc3497059c8 -- src agents/advanced/src agents/advanced/tests scripts tests docs .github/workflows/astra-path-tests.yml
          python - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          encoded=''.join(Path(f'.github/semantic-progress-payload-{i}.b64').read_text().strip() for i in range(1,4))
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest() == '6521c32a01bc5db9ca33b58f0d969aa5d564194218658c638647bd64707af44f', 'Patch integrity check failed'
          Path('/tmp/semantic-progress.patch').write_bytes(patch)
          PY
          git apply --check --unidiff-zero /tmp/semantic-progress.patch
          git apply --unidiff-zero /tmp/semantic-progress.patch
      - name: Install pinned offline dependencies without project manifest changes
        run: |
          npm install --prefix "$RUNNER_TEMP/semantic-tests" --ignore-scripts --no-audit --no-fund --no-package-lock zod@4.1.5 typescript@5.9.3 @types/node@22.16.0
          ln -s "$RUNNER_TEMP/semantic-tests/node_modules" agents/advanced/node_modules
      - name: Validate shared planner, actual controller scenarios and advanced recovery
        run: |
          git diff --check
          npm run test:agency
          npm run test:integration
          npm run check:agency
          bun test src/action-outcome.test.ts src/training/discovery.test.ts agents/advanced/tests src/navigation/agency-route.test.ts
      - name: Commit validated source files (workflow updates use the authorized connector separately)
        run: |
          git add agents/advanced/src/agency-bridge.ts agents/advanced/src/live-cli.ts agents/advanced/src/live-policy.ts agents/advanced/src/transient-recovery.ts agents/advanced/tests/semantic-recovery.test.ts docs/SEMANTIC_PROGRESS.md scripts/agency-status.ts scripts/status-export.ts scripts/supervise.ts src/agency/director.ts src/agency/live-adapter.ts src/agency/progress.ts src/agency/step-retry.ts src/agency/types.ts src/agency/world-model.ts src/agent.ts tests/agency/semantic-progress.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Track causal progress, defer reversible cycles, and reconcile eligible unknown interactions'
          git push origin HEAD:fix/semantic-progress-recovery
