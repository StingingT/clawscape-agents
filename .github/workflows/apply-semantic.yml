name: Apply semantic items and survey recovery
on:
  push:
    branches: [codex/semantic-items-survey-recovery]
    paths: [.github/workflows/apply-semantic.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.10'
      - name: Verify transport and every source hash; apply exact tested patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          packed=base64.b64decode(''.join(pathlib.Path(f'.github/semantic-transport/{n}.b64').read_text().strip() for n in range(5)),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='bc06c928c6d65205225de6ce3a9e9c5c7ae7831ab81e83e736c1b4f2e37a958b','TRANSPORT_HASH_MISMATCH'
          doc=json.loads(lzma.decompress(packed))
          assert set(doc['before'])==set(doc['after']) and len(doc['after'])==33
          for name,expected in doc['before'].items():
              p=pathlib.Path(name)
              assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts and not p.is_symlink()
              assert name.startswith(('src/','scripts/','tests/','agents/advanced/src/','agents/advanced/tests/','docs/','.github/workflows/')) or name=='package.json'
              assert (hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None)==expected, 'BASE_MISMATCH:'+name
          patch=pathlib.Path('/tmp/semantic.patch');patch.write_text(doc['patch'])
          subprocess.run(['git','apply','--check','--unidiff-zero',str(patch)],check=True)
          subprocess.run(['git','apply','--unidiff-zero',str(patch)],check=True)
          for name,expected in doc['after'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==expected,'RESULT_MISMATCH:'+name
          pathlib.Path('/tmp/reviewed-paths.txt').write_text('\n'.join(doc['after'])+'\n')
          print('Verified and applied',len(doc['after']),'reviewed files')
          PY
      - name: Install pinned offline test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/agency-tests" --ignore-scripts --no-audit --no-fund --no-package-lock zod@4.1.5 typescript@5.9.3 @types/node@22.16.0
          ln -s "$RUNNER_TEMP/agency-tests/node_modules" agents/advanced/node_modules
      - name: Bundle bounded public drop leads with source revision and unverified status
        run: bun scripts/refresh-drop-leads.ts --output knowledge/2004scape-drop-leads.json
      - run: npm run test:agency
      - run: npm run test:integration
      - run: npm run check:agency
      - name: Native outcome, training, navigation and advanced controller regressions
        run: bun test src/action-outcome.test.ts src/training/discovery.test.ts agents/advanced/tests src/navigation/agency-route.test.ts
      - name: Read-only export and filesystem checks
        run: node --experimental-strip-types --test tests/startup/upstream-path.test.ts tests/agency/status-export.test.ts
      - name: Commit tested source and public leads only
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          import pathlib,subprocess
          # Workflow updates are published separately through the authorized connector.
          # The Actions contents token must not attempt to write workflow files.
          paths=[p for p in pathlib.Path('/tmp/reviewed-paths.txt').read_text().splitlines() if not p.startswith('.github/workflows/')]
          paths+=['knowledge/2004scape-drop-leads.json']
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Resolve item identities and linked acquisition; recover surveys, attribute combat events and export safe status'
          git push origin HEAD:codex/semantic-items-survey-recovery
