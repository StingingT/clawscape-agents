name: Trip recovery source snapshot
on:
  push:
    branches: [codex/adaptive-trip-recovery]
    paths: [.github/workflows/trip-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Package tracked source and pinned compiler dependencies only
        run: |
          git archive --format=zip --output=trip-source.zip HEAD
          npm install --prefix "$RUNNER_TEMP/trip-deps" --ignore-scripts --no-audit --no-fund --no-package-lock zod@4.1.5 typescript@5.9.3 @types/node@22.16.0
          cd "$RUNNER_TEMP/trip-deps"
          zip -qr "$GITHUB_WORKSPACE/trip-deps.zip" node_modules
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trip-source
          path: |
            trip-source.zip
            trip-deps.zip
          retention-days: 1
