name: Apply opportunistic resource behavior
on:
  push:
    branches: [codex/opportunistic-resources]
    paths: [.github/workflows/apply-opportunistic.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.16.0'}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: {bun-version: '1.3.10'}
      - name: Apply reviewed integration edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def replace(path, old, new, count=1):
              p=Path(path); s=p.read_text(); n=s.count(old)
              assert n==count, f'{path}: expected {count} matches, found {n}'
              p.write_text(s.replace(old,new,count))

          replace('src/agent.ts',
            "import { bindItems, resolveItems, MissingItem, type ItemRef } from './agency/item-intents.ts';",
            "import { bindItems, resolveItems, MissingItem, type ItemRef } from './agency/item-intents.ts';\nimport { incidentalCandidate, incidentalBankable, emptyIncidental, recordIncidental, type IncidentalMemory } from './agency/opportunistic-resources.ts';")
          replace('src/agent.ts',
            "work: { foodBatch?: FoodBatch; fishing?: FishingPreparation; economy?: EconomyMemory; resource?: { goal?: string; site?: string; lastBankAt?: number }; autonomy?: AutonomyMemory; learning?: Json & { food?: FoodExperience }; appearance?: AppearanceMemory; foodWithdrawalPending?: boolean | 'raw'; fishingToolFundingUntil?: number; fishingToolTradeAttempted?: boolean; pickpocketStreak?: number; bankReturn?: { x: number; z: number; level: number }; bankReturnReady?: boolean; bankItems?: Json[]; failures: Record<string, { until: number; count: number }> }",
            "work: { foodBatch?: FoodBatch; fishing?: FishingPreparation; economy?: EconomyMemory; resource?: { goal?: string; site?: string; lastBankAt?: number }; autonomy?: AutonomyMemory; learning?: Json & { food?: FoodExperience }; appearance?: AppearanceMemory; opportunistic?: IncidentalMemory; foodWithdrawalPending?: boolean | 'raw'; fishingToolFundingUntil?: number; fishingToolTradeAttempted?: boolean; pickpocketStreak?: number; bankReturn?: { x: number; z: number; level: number }; bankReturnReady?: boolean; bankItems?: Json[]; failures: Record<string, { until: number; count: number }> }")
          replace('src/agent.ts',
            "function bankingCandidates(state: GameState, task?: Task): Candidate[] {\n  const inventory = state.inventory ?? [];",
            "function bankingCandidates(state: GameState, task?: Task): Candidate[] {\n  const inventory = state.inventory ?? [];\n  work.opportunistic ??= emptyIncidental();")
          replace('src/agent.ts',
            "    if (isAgentClutter(item, build, equippedNames, keepWeaponName)) return true;\n    if (isFinishedArrow(itemName)) return surplusArrows > 0;\n    return edible ? surplusFood > 0 : isBankableResource(String(item.name));",
            "    if (isAgentClutter(item, build, equippedNames, keepWeaponName)) return true;\n    if (isFinishedArrow(itemName)) return surplusArrows > 0;\n    if (incidentalBankable(item, work.opportunistic!)) return true;\n    return edible ? surplusFood > 0 : isBankableResource(String(item.name));")
          replace('src/agent.ts',
            "      if (check.verified)observeAgencyResult(pending.before,state,pending.action as Candidate);\n    }\n    // No legacy action candidates or synthetic per-click goals are constructed before this selection.\n    const planned=agency.plan(state);",
            "      if (check.verified)observeAgencyResult(pending.before,state,pending.action as Candidate);\n    }\n    const sidePending=agency.pendingSide();\n    if(sidePending){\n      const check=verifyActionOutcome(sidePending.before,state,sidePending.action,sidePending.execution);\n      agency.recordSide(sidePending.commandId,state,check.uncertain?(agency.settleSide(sidePending.commandId,state)??verification(check)):verification(check));\n      if(agency.pendingSide()){await cliCall(['wait','2']);continue;}\n      if(check.verified){\n        observeAgencyResult(sidePending.before,state,sidePending.action as Candidate);\n        work.opportunistic??=emptyIncidental();recordIncidental(work.opportunistic,sidePending.before,state,sidePending.action,Date.now());saveWork();\n      }\n    }\n    if(!agency.pending()&&!agency.pending('safety')){\n      work.opportunistic??=emptyIncidental();\n      const domain=agency.summary().goal?.domain;\n      let side=incidentalCandidate(state,domain==='gathering'?'gathering':domain==='combat'?'combat':undefined) as Candidate|undefined;\n      if(side){\n        try{side=bindItems(side,state) as Candidate;const fresh=stateFrom(await cliCall(['state']));side=resolveItems(side,fresh) as Candidate;state=fresh;}catch{side=undefined;}\n        if(side){\n          const commandId=agency.beginSide(side,state,randomUUID());\n          try{const {next,result}=await executeAgencyAction(state,side);agency.rememberExecution(commandId,result);const check=verifyActionOutcome(state,next,side,result);agency.recordSide(commandId,next,verification(check));if(check.verified){observeAgencyResult(state,next,side);recordIncidental(work.opportunistic, state,next,side,Date.now());saveWork();}state=next;}\n          catch(error){agency.recordSide(commandId,state,{status:'unknown',evidence:[],reason:String(error)});}\n          continue;\n        }\n      }\n    }\n    // No legacy action candidates or synthetic per-click goals are constructed before this selection.\n    const planned=agency.plan(state);")

          replace('src/agency/live-adapter.ts',
            "type Document = { acquisition?:AcquisitionMemory; interruptions?:Array<{at:number;receipt:Receipt;reason:string}>; trips?:TripLearning; preparation?:TripPreparation; version:2; memory:Memory; knowledge:Knowledge; receipt?:Receipt; safetyReceipt?:Receipt;",
            "type Document = { acquisition?:AcquisitionMemory; interruptions?:Array<{at:number;receipt:Receipt;reason:string}>; trips?:TripLearning; preparation?:TripPreparation; version:2; memory:Memory; knowledge:Knowledge; receipt?:Receipt; safetyReceipt?:Receipt; sideReceipt?:Receipt;")
          replace('src/agency/live-adapter.ts',
            "export type Receipt = { commandId:string; action:LiveCandidate; before:LiveState; startedAt:number; scope:'task'|'safety';",
            "export type Receipt = { commandId:string; action:LiveCandidate; before:LiveState; startedAt:number; scope:'task'|'safety'|'side';")
          replace('src/agency/live-adapter.ts',
            "  pending(scope:'task'|'safety'='task'):Receipt|undefined {\n    const receipt=scope==='safety'?this.document.safetyReceipt:this.document.receipt;\n    return receipt && structuredClone(receipt);\n  }",
            "  pending(scope:'task'|'safety'='task'):Receipt|undefined {\n    const receipt=scope==='safety'?this.document.safetyReceipt:this.document.receipt;\n    return receipt && structuredClone(receipt);\n  }\n  pendingSide():Receipt|undefined { return this.document.sideReceipt&&structuredClone(this.document.sideReceipt); }")
          replace('src/agency/live-adapter.ts',
            "    const r=this.document.receipt?.commandId===commandId?this.document.receipt:this.document.safetyReceipt;",
            "    const r=this.document.receipt?.commandId===commandId?this.document.receipt:this.document.safetyReceipt?.commandId===commandId?this.document.safetyReceipt:this.document.sideReceipt?.commandId===commandId?this.document.sideReceipt:undefined;",2)
          replace('src/agency/live-adapter.ts',
            "  /** Funding is an observed prerequisite. This never grants purchase authority by itself. */",
            "  beginSide(action:LiveCandidate,state:LiveState,commandId:string=randomUUID()):string {\n    if(this.document.receipt||this.document.safetyReceipt||this.document.sideReceipt)throw new Error('RECONCILE_PENDING_ACTION_FIRST');\n    if(!incidentalSideAction(state,action))throw new Error('UNSAFE_OR_UNVERIFIED_SIDE_ACTION');\n    this.document.sideReceipt={commandId,action:structuredClone(action),before:structuredClone(state),startedAt:this.clock(),scope:'side'};this.save();return commandId;\n  }\n  settleSide(commandId:string,state:LiveState):Verification|undefined {\n    const r=this.document.sideReceipt;if(!r||r.commandId!==commandId)return;\n    const result=observeQuietStep(r.action,r.before,state,this.clock(),this.observer,r.stationary);r.stationary=result.window;this.save();\n    return result.settled?{status:'interrupted',evidence:[result.reason],reason:result.reason}:undefined;\n  }\n  recordSide(commandId:string,after:LiveState,verification:Verification):void {\n    const r=this.document.sideReceipt;if(!r||r.commandId!==commandId)throw new Error('SIDE_OUTCOME_WITHOUT_MATCHING_INTENT');\n    this.document.lastOutcome={at:this.clock(),commandId,type:r.action.type,status:verification.status,reason:verification.reason,evidence:verification.evidence.slice(0,8)};\n    if(verification.status==='unknown'||!verification.evidence.length){this.save();return;}\n    delete this.document.sideReceipt;this.document.lastCommands=[...this.document.lastCommands,commandId].slice(-128);this.save();\n  }\n  /** Funding is an observed prerequisite. This never grants purchase authority by itself. */")
          replace('src/agency/live-adapter.ts',
            "      goal:this.director.memory.active,pending:brief(this.pending()),safetyPending:brief(this.pending('safety')),blocked:this.document.blocked};",
            "      goal:this.director.memory.active,pending:brief(this.pending()),safetyPending:brief(this.pending('safety')),sidePending:brief(this.pendingSide()),blocked:this.document.blocked};")
          replace('src/agency/live-adapter.ts',
            "export const isSelection=(v:Selection|Decision):v is Selection=>'decision' in v;\n\nexport function safetyAction",
            "export const isSelection=(v:Selection|Decision):v is Selection=>'decision' in v;\n\nexport function incidentalSideAction(state:LiveState,action:LiveCandidate):boolean {\n  if(state.inGame===false||state.player?.isDead===true||state.player?.combat?.inCombat===true||state.bank?.isOpen===true||state.shop?.isOpen===true||state.dialog?.isOpen===true||state.modalOpen===true)return false;\n  if(action.fields?.playerIndex!==undefined||action.fields?.targetType==='player')return false;\n  if(action.type==='pickupItem'){const g=(state.groundItems??[]).find((i:any)=>i.id===action.fields?.itemId&&(i.x??i.tileX)===action.fields?.x&&(i.z??i.tileZ)===action.fields?.z);return !!g&&g.reachable===true&&(state.inventory??[]).length<Number(state.capacity??28)-1;}\n  if(action.type==='useInventoryItem'){const i=(state.inventory??[]).find((x:any)=>x.slot===action.fields?.slot);const o=(i?.optionsWithIndex??[]).find((x:any)=>x.opIndex===action.fields?.optionIndex);return !!o&&/^bury$/i.test(String(o.text));}\n  if(action.type==='useItemOnLoc'){const i=(state.inventory??[]).find((x:any)=>x.slot===action.fields?.itemSlot);const l=(state.nearbyLocs??[]).find((x:any)=>x.id===action.fields?.locId&&x.x===action.fields?.x&&x.z===action.fields?.z);return /^raw\\b/i.test(String(i?.name??''))&&!!l&&/^(fire|fireplace|range|stove|cooking pot)$/i.test(String(l.name??''))&&Math.max(Math.abs(Number(state.player?.worldX)-Number(l.x)),Math.abs(Number(state.player?.worldZ)-Number(l.z)))<=1;}\n  return false;\n}\n\nexport function safetyAction")

          replace('agents/advanced/src/live-policy.ts',
            "const depositable = (i: Item) => !i.protected && !supplyItem(i) &&\n  /^(cowhide|cow hide|bones|burnt (?:fish|shrimps|shrimp|meat|chicken)|ashes|copper ore|tin ore|iron ore|wool|bronze dagger|shortbow|bronze arrows?|(?:air|mind|water|earth|fire|body) runes?)$/.test(normalize(i.name));",
            "const depositable = (i: Item) => !i.protected && !supplyItem(i);")
          replace('agents/advanced/src/live-policy.ts',
            "const lootAllowed = (e: Entity) => supplyItem(e) || /^(cowhide|cow hide|bones)$/.test(normalize(e.name));",
            "const lootAllowed = (e: Entity) => e.kind === 'ground_item' && e.reachable === true;")
          PY
      - name: Install pinned test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/agency-tests" --ignore-scripts --no-audit --no-fund --no-package-lock zod@4.1.5 typescript@5.9.3 @types/node@22.16.0
          ln -s "$RUNNER_TEMP/agency-tests/node_modules" agents/advanced/node_modules
      - run: npm run test:agency
      - run: npm run test:integration
      - run: npm run check:agency
      - run: bun test tests/agency/opportunistic-resources.test.ts agents/advanced/tests/agency-policy.test.ts src/action-outcome.test.ts
      - name: Commit validated behavior
        run: |
          git diff --check
          git add src/agent.ts src/agency/live-adapter.ts src/agency/opportunistic-resources.ts tests/agency/opportunistic-resources.test.ts agents/advanced/src/live-policy.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add opportunistic incidental resource behavior'
          git push origin HEAD:codex/opportunistic-resources
