name: Validate researched build integration
on:
  push:
    branches: [codex/strategic-hierarchy-builds]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'StingingT/clawscape-agents' && contains(github.event.head_commit.message, '[apply-build-guides]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/strategic-hierarchy-builds
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.10'
      - name: Apply reviewed source with exact before/after hashes
        run: python3 .ci/apply-build-guides.py
      - name: Install pinned offline test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/agency-tests" --ignore-scripts --no-audit --no-fund --no-package-lock zod@4.1.5 typescript@5.9.3 @types/node@22.16.0
          ln -s "$RUNNER_TEMP/agency-tests/node_modules" agents/advanced/node_modules
      - run: npm run test:agency
      - run: npm run test:integration
      - run: npm run check:agency
      - name: Native source-gated training, navigation and advanced regressions
        run: bun test src/action-outcome.test.ts src/training/discovery.test.ts agents/advanced/tests src/navigation/agency-route.test.ts
      - name: Publish tested readable source only
        run: python3 .ci/apply-build-guides.py --commit
