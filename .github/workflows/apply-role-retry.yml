name: Retry role and dialogue recovery
on:
  push:
    branches: [codex/role-ambitions-dialogue-audit]
    paths: [.github/workflows/apply-role-retry.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.10'
      - name: Recover and apply the already reviewed patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, pathlib, re
          text = pathlib.Path('.github/workflows/apply-role.yml').read_text()
          match = re.search(r"echo '([^']+)' \| base64 -d > /tmp/role\.patch", text)
          if not match:
              raise SystemExit('reviewed patch payload not found')
          pathlib.Path('/tmp/role.patch').write_bytes(base64.b64decode(match.group(1)))
          PY
          git apply --check /tmp/role.patch
          git apply /tmp/role.patch
      - name: Install pinned offline test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/agency-tests" --ignore-scripts --no-audit --no-fund --no-package-lock zod@4.1.5 typescript@5.9.3 @types/node@22.16.0
          ln -s "$RUNNER_TEMP/agency-tests/node_modules" agents/advanced/node_modules
      - name: Agency tests
        run: npm run test:agency
      - name: Integration tests
        run: npm run test:integration
      - name: Type checks
        run: npm run check:agency
      - name: Focused Bun tests
        run: bun test tests/agency/build-guides.test.ts agents/advanced/tests/restart-journals.test.ts
      - name: Commit tested source only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/agency/development.ts scripts/supervise.ts agents/advanced/src/transient-recovery.ts agents/advanced/src/restart-journals.ts tests/agency/build-guides.test.ts agents/advanced/tests/restart-journals.test.ts
          git commit -m 'Keep broad role ambitions and safely retire stale dialogue contexts'
          git push origin HEAD:codex/role-ambitions-dialogue-audit
