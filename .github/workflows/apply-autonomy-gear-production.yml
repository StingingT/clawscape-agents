name: Apply autonomy gear production fixes
on:
  push:
    branches:
      - codex/autonomy-gear-production-recovery
    paths:
      - .github/workflows/apply-autonomy-gear-production.yml
      - .github/scripts/apply_autonomy_gear.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.10'
      - name: Apply source changes
        run: python3 .github/scripts/apply_autonomy_gear.py
      - name: Install pinned dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/agency-tests" --ignore-scripts --no-audit --no-fund --no-package-lock zod@4.1.5 typescript@5.9.3 @types/node@22.16.0
          ln -s "$RUNNER_TEMP/agency-tests/node_modules" agents/advanced/node_modules
      - run: npm run test:agency
      - run: npm run test:integration
      - run: npm run check:agency
      - run: bun test agents/advanced/tests/agency-policy.test.ts tests/agency/gear-readiness.test.ts
      - name: Commit tested source only
        run: |
          git diff --check
          git add src/agency/director.ts src/agency/live-adapter.ts src/agency/world-model.ts src/agent.ts agents/advanced/src/live-cli.ts tests/agency/director.test.ts tests/agency/gear-readiness.test.ts agents/advanced/tests/agency-policy.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Replan dead ends and use owned gear upgrades'
          git push origin HEAD:codex/autonomy-gear-production-recovery
